# Dependabot 配置：自动检测依赖更新并创建 PR。
# 按周检查 npm 和 GitHub Actions 依赖。
version: 2

updates:
  # npm 依赖（前端 + Edge Functions 共用 package-lock.json）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Hong_Kong"
    # 限制同时打开的 PR 数量，避免 PR 洪水
    open-pull-requests-limit: 5
    # 按类型分组，减少 PR 数量
    groups:
      expo:
        patterns:
          - "expo*"
          - "@expo*"
      react-native:
        patterns:
          - "react-native*"
          - "@react-native*"
          - "@react-navigation*"
      dev-tools:
        dependency-type: "development"
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # GitHub Actions 版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Hong_Kong"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
