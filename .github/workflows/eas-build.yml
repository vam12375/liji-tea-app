# EAS Build 按需触发。
# 给 PR 打上 `build-apk` label 时自动触发 Android preview 构建，
# 构建完成后将 APK 下载链接评论回 PR。
# 也支持手动触发（workflow_dispatch）。
name: eas-build

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: "构建 profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false # 构建耗时长，不要轻易取消

permissions:
  contents: read
  pull-requests: write # 需要写评论

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 仅在 label 为 build-apk 或手动触发时运行
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'build-apk')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Determine build params
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=${{ inputs.platform }}" >> "$GITHUB_OUTPUT"
            echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "platform=android" >> "$GITHUB_OUTPUT"
            echo "profile=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Run EAS Build
        id: build
        run: |
          BUILD_OUTPUT=$(eas build \
            --platform ${{ steps.params.outputs.platform }} \
            --profile ${{ steps.params.outputs.profile }} \
            --non-interactive \
            --json 2>&1 | tail -1)
          echo "result=$BUILD_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Extract build URL
        id: url
        run: |
          URL=$(echo '${{ steps.build.outputs.result }}' | jq -r '.[0].artifacts.buildUrl // .[0].buildDetailsPageUrl // "构建已提交，请到 Expo 控制台查看"')
          echo "build_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.url.outputs.build_url }}';
            const platform = '${{ steps.params.outputs.platform }}';
            const profile = '${{ steps.params.outputs.profile }}';
            const body = `## 📦 EAS Build 完成

            | 项目 | 值 |
            |------|-----|
            | 平台 | ${platform} |
            | Profile | ${profile} |
            | 下载/详情 | ${url} |

            > 由 \`build-apk\` label 自动触发`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
