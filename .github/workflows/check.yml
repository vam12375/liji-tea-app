# 强制执行 lint + typecheck（应用 & Edge Functions）+ 测试 + 安全扫描。
# 在 PR 与 push 到 master 时自动运行，任一环节失败即阻断合并。
name: check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  # 同一分支新推送会取消前一次运行，节省 CI 时长。
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 需要完整历史

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # 使用 npm ci 严格遵循 package-lock.json，保证可复现。
        run: npm ci

      - name: Run check (lint + typecheck:all + test)
        # check 脚本已定义于 package.json，涵盖 eslint、tsc 应用端、tsc Edge Functions、tsx 测试。
        run: npm run check

  security:
    name: security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (critical = block, high = warn)
        # critical 级别直接阻断 CI；high 级别仅输出警告不阻断。
        # 原因：Expo SDK 间接依赖（@xmldom/xmldom、postcss via @expo/metro-config）
        # 存在 high 级别漏洞但无法在不破坏 Expo 的前提下修复，等待上游发版。
        run: |
          echo "::group::npm audit (high) - informational"
          npm audit --audit-level=high || echo "::warning::npm audit 发现 high 级别漏洞，请关注上游修复进度"
          echo "::endgroup::"
          echo "--- Blocking check: critical only ---"
          npm audit --audit-level=critical
