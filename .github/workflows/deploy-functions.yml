# Supabase Edge Functions 部署。
# 当 master 上 supabase/functions/ 目录有变更时，自动部署受影响的 function 到 staging。
# Production 部署仅在打 tag 时触发。
name: deploy-functions

on:
  push:
    branches: [master]
    paths:
      - "supabase/functions/**"
  release:
    types: [published]

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  detect-changes:
    name: detect changed functions
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.diff.outputs.functions }}
      has_changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史，才能比较一次 push 中的全部 commit。

      - name: Detect changed functions
        id: diff
        run: |
          set -euo pipefail

          list_all_functions() {
            find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | grep -v "^_" \
              | sort
          }

          to_json_array() {
            jq -R -s -c 'split("\n") | map(select(length > 0))'
          }

          if [ "${{ github.event_name }}" = "release" ]; then
            # Release 时部署全部 functions
            FUNCTIONS=$(list_all_functions | to_json_array)
          else
            # Push 时比较本次 push 的完整范围，而不是只看最后一个 commit。
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"

            # 新分支或特殊 push 事件下 before 可能是全 0；此时退回到当前历史的根提交。
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
            fi

            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- supabase/functions/)

            # _shared 被打包进每个函数；共享代码变化时需要重新部署全部 functions。
            if printf '%s\n' "$CHANGED_FILES" | grep -q '^supabase/functions/_shared/'; then
              FUNCTIONS=$(list_all_functions | to_json_array)
            else
              FUNCTIONS=$(
                printf '%s\n' "$CHANGED_FILES" \
                  | awk -F/ '$1 == "supabase" && $2 == "functions" && $3 !~ /^_/ { print $3 }' \
                  | sort -u \
                  | while read -r function_name; do
                      if [ -d "supabase/functions/$function_name" ]; then
                        printf '%s\n' "$function_name"
                      fi
                    done \
                  | to_json_array
              )
            fi
          fi
          echo "functions=$FUNCTIONS" >> "$GITHUB_OUTPUT"
          if [ "$FUNCTIONS" = "[]" ] || [ -z "$FUNCTIONS" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-staging:
    name: deploy to staging
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        function: ${{ fromJson(needs.detect-changes.outputs.functions) }}
      max-parallel: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ${{ matrix.function }} to staging
        run: |
          supabase functions deploy ${{ matrix.function }} \
            --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}

  deploy-production:
    name: deploy to production
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    strategy:
      matrix:
        function: ${{ fromJson(needs.detect-changes.outputs.functions) }}
      max-parallel: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ${{ matrix.function }} to production
        run: |
          supabase functions deploy ${{ matrix.function }} \
            --project-ref ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
